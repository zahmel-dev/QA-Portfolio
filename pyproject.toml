[project]
name = "QA-Portfolio"
version = "0.1.0"
description = "Practice repository for Python exercises, unit testing, and E2E test automation with Pytest, Playwright, and Selenium."
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
